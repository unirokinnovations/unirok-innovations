{% extends "base.html" %}
{% block title %}{{ post.title }} | Unirok Blog{% endblock %}
{% block content %}
<section class="py-20 fade-in max-w-3xl mx-auto px-6">
    <div class="mb-10 text-center">
        <h1 class="text-4xl font-bold text-unirokGold mb-4">{{ post.title }}</h1>
        <div class="text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest">{{ post.created_at.strftime('%B %d, %Y') }}</div>
    </div>
    
    <div class="prose dark:prose-invert prose-lg max-w-none text-gray-700 dark:text-gray-300 leading-relaxed">
        {{ post.content | safe }}
    </div>
    
    <div class="mt-16 pt-8 border-t border-gray-200 dark:border-white/10 text-center">
        <a href="{{ url_for('blog_index') }}" class="text-unirokGold hover:text-gray-900 dark:hover:text-white transition-colors font-bold uppercase text-xs tracking-widest">← Back to all updates</a>
    </div>
</section>
{% endblock %}
