{% extends "base.html" %}

{% block content %}
<section class="py-20 fade-in text-center max-w-sm mx-auto px-6">
    <div class="bg-gray-50 dark:bg-unirokDark border border-gray-200 dark:border-white/10 p-8 rounded-2xl shadow-xl dark:shadow-none">
        <h1 class="text-2xl font-bold text-unirokGold mb-8 tracking-tight">Admin Portal</h1>
        
        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
            <div class="text-left">
                <label class="block text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-2 ml-1">Password</label>
                <input type="password" name="password" required class="w-full bg-white dark:bg-black border border-gray-300 dark:border-white/20 rounded-xl px-4 py-3 text-gray-900 dark:text-white focus:outline-none focus:border-unirokGold transition-all font-medium" placeholder="Enter security passphrase...">
            </div>
            <button type="submit" class="w-full bg-unirokGold text-black font-bold py-4 rounded-xl hover:bg-yellow-400 transition-all transform hover:-translate-y-1 shadow-lg shadow-unirokGold/20">
                Secure Login
            </button>
        </form>
    </div>
</section>
{% endblock %}
